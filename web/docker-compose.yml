# Development services for the web app: PostGIS and Redis.
#   docker compose -f web/docker-compose.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: minefoot
      POSTGRES_USER: minefoot
      POSTGRES_PASSWORD: minefoot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
